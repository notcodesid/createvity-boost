[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# Prefer literal source in metadata for Sourcify-style verification
use_literal_content = true

# --- Monad Testnet (default for Spark hack) ---
# https://docs.monad.xyz/guides/deploy-smart-contract/foundry
eth-rpc-url = "https://testnet-rpc.monad.xyz"
chain_id = 10143

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad_mainnet = "https://rpc.monad.xyz"

# Optional named profiles
[profile.testnet]
eth-rpc-url = "https://testnet-rpc.monad.xyz"
chain_id = 10143

[profile.mainnet]
eth-rpc-url = "https://rpc.monad.xyz"
chain_id = 143
